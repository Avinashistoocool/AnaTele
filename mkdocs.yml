site_name: AnaTele
site_description: "AnaTele by Avinash Chandra Gupta: drone crash investigation for ArduPilot flight logs with 3D replay, diagnostics and ranked hypotheses."
site_url: https://avinashistoocool.github.io/AnaTele/
site_author: Avinash Chandra Gupta
copyright: \"&copy; 2026 Avinash Chandra Gupta (Avinash Gupta) &middot; <a href='https://avinashistoocool.github.io/'>avinashistoocool.github.io</a>\"
repo_url: https://github.com/Avinashistoocool/AnaTele
repo_name: Avinashistoocool/AnaTele
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
exclude_docs: |
  *.tex
  figures/

theme:
  name: material
  logo: images/anatele_concept2_icon.svg
  favicon: images/anatele_concept2_icon.svg
  palette:
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle: {icon: material/brightness-4, name: Light mode}
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle: {icon: material/brightness-7, name: Dark mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Learn (illustrated guide):
      - Start here: learn/index.md
      - 1. Drones 101: learn/01-drones-101.md
      - 2. Logs and MAVLink: learn/02-logs-and-mavlink.md
      - 3. Time and sources: learn/03-time-and-sources.md
      - 4. Flight phases: learn/04-flight-phases.md
      - 5. Attitude and tilt error: learn/05-attitude-and-tilt-error.md
      - 6. Motors and mixing: learn/06-motors-and-mixing.md
      - 7. Vibration, EKF and compass: learn/07-vibration-ekf-compass.md
      - 8. Rules and their four states: learn/08-rules-and-states.md
      - 9. Hypotheses: learn/09-hypotheses.md
      - 10. Missions and geometry: learn/10-missions-and-geometry.md
      - 11. The simulator: learn/11-simulator.md
      - 12. Sharing with .ant files: learn/12-sharing-ant.md
      - Glossary: learn/glossary.md
      - Interactive widgets: learn/widgets-demo.md
      - Illustrated guide (PDF): AnaTele_Illustrated_Guide.pdf
  - Usage guide: USAGE.md
  - Preflight checklist: PREFLIGHT.md
  - Diagnostics reference: DIAGNOSTICS.md
  - Deployment: DEPLOYMENT.md
  - Design: DESIGN.md
  - Technical report (PDF): AnaTele_Technical_Report.pdf

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/learn.js

extra_css:
  - stylesheets/learn.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://avinashistoocool.github.io/
      name: Avinash Chandra Gupta
    - icon: fontawesome/brands/github
      link: https://github.com/Avinashistoocool
      name: Avinash Chandra Gupta on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/avinashistoocool
      name: Avinash Chandra Gupta on LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/suprcoolavinash
      name: Avinash Chandra Gupta on X
