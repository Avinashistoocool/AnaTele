name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: AnaTele-windows.zip
          - os: macos-latest
            archive: AnaTele-macos.zip
          - os: ubuntu-latest
            archive: AnaTele-linux.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[desktop,dev]"
      - run: pyinstaller --noconfirm anatele.spec
      - name: Bundle simulations and docs
        shell: bash
        run: |
          python -m telemetry_platform.simulator --out dist/AnaTele/simulations
          cp README.md LICENSE dist/AnaTele/
          cp -r docs dist/AnaTele/docs
      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../${{ matrix.archive }} AnaTele; else zip -qr ../${{ matrix.archive }} AnaTele; fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
