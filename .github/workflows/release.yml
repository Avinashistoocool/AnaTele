name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Build jobs get a read-only token. Only the final publish job, which runs no third-party
# build tooling, can write to the release.
permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: AnaTele-windows.zip
          - os: macos-latest
            archive: AnaTele-macos.zip
          - os: ubuntu-latest
            archive: AnaTele-linux.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install hash-locked build dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/release.txt
          python -m pip install --no-deps --no-build-isolation .
      - run: pyinstaller --noconfirm anatele.spec
      - name: Bundle simulations and docs
        shell: bash
        run: |
          python -m telemetry_platform.simulator --out dist/AnaTele/simulations
          cp README.md LICENSE dist/AnaTele/
          cp -r docs dist/AnaTele/docs
      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../${{ matrix.archive }} AnaTele; else zip -qr ../${{ matrix.archive }} AnaTele; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --require-hashes --no-deps -r requirements/release.txt
          python -m build --no-isolation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [desktop, wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload assets
      id-token: write        # sign build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: |
            assets/*.zip
            assets/*.whl
            assets/*.tar.gz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: assets/*
