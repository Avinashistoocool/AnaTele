<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="512" height="512">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .ring-grey { fill: none; stroke: #dcdcdc; stroke-width: 10; stroke-linecap: round; }
      .hub-grey { fill: none; stroke: #dcdcdc; stroke-width: 7; }
      .ring-red { fill: none; stroke: #e05a5a; stroke-width: 10; stroke-linecap: round; }
      .hub-red { fill: #e05a5a; }
      .tick-red { stroke: #e05a5a; stroke-width: 6; stroke-linecap: round; }
      .dot-red { fill: #e05a5a; }
      .path-blue { fill: none; stroke: #5ab4e0; stroke-width: 6.5; stroke-linecap: round; stroke-dasharray: 10 14; }
    </style>
  </defs>

  <!-- Rounded Square App Icon Background -->
  <rect class="bg" width="360" height="360" rx="64" />

  <!-- Top-Left Rotor Ring -->
  <circle class="ring-grey" cx="95" cy="95" r="62" />
  <circle class="hub-grey" cx="95" cy="95" r="14" />

  <!-- Bottom-Left Rotor Ring -->
  <circle class="ring-grey" cx="95" cy="265" r="62" />
  <circle class="hub-grey" cx="95" cy="265" r="14" />

  <!-- Bottom-Right Rotor Ring -->
  <circle class="ring-grey" cx="265" cy="265" r="62" />
  <circle class="hub-grey" cx="265" cy="265" r="14" />

  <!-- Breadcrumb Flight Path -->
  <path class="path-blue" d="
    M 107 254
    C 155 200, 225 200, 260 251
    C 225 268, 175 262, 182 215
    C 190 165, 205 130, 175 103
    C 152 84, 128 92, 111 95
    C 102 128, 130 165, 175 162
    C 212 160, 238 135, 255 107
  " />

  <!-- Top-Right Rotor Ring (Coral-Red Anomaly / Target Reticle) -->
  <circle class="ring-red" cx="265" cy="95" r="62" />
  <circle class="hub-red" cx="265" cy="95" r="14" />
  <line class="tick-red" x1="265" y1="49" x2="265" y2="59" />
  <line class="tick-red" x1="311" y1="95" x2="301" y2="95" />
  <line class="tick-red" x1="265" y1="141" x2="265" y2="131" />
  <circle class="dot-red" cx="291" cy="68" r="5.5" />
</svg>